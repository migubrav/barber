<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión · Panel Barbería</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1410 0%, #2d2420 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .login-container {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(212, 175, 119, 0.2);
            border-radius: 12px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .pole {
            display: inline-block;
            width: 4px;
            height: 40px;
            background: linear-gradient(to bottom, #a0826d 0%, #FFD700 50%, #a0826d 100%);
            margin-right: 10px;
            vertical-align: middle;
        }

        .login-header h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 15px 0 8px;
            color: #FFD700;
        }

        .login-header p {
            font-size: 13px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #ccc;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(212, 175, 119, 0.3);
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.12);
            border-color: #D4AF77;
            box-shadow: 0 0 0 3px rgba(212, 175, 119, 0.1);
        }

        input::placeholder {
            color: #666;
        }

        .form-group select {
            cursor: pointer;
        }

        .login-button {
            width: 100%;
            padding: 12px;
            background: #D4AF77;
            color: #1a1410;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .login-button:hover:not(:disabled) {
            background: #FFD700;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(212, 175, 119, 0.3);
        }

        .login-button:active:not(:disabled) {
            transform: translateY(0);
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
        }

        .alert.error {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.4);
            display: block;
        }

        .alert.success {
            background: rgba(34, 197, 94, 0.2);
            color: #86efac;
            border: 1px solid rgba(34, 197, 94, 0.4);
            display: block;
        }

        .loading {
            display: inline-block;
            width: 4px;
            height: 4px;
            background: currentColor;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
            margin-right: 6px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .info-text {
            font-size: 12px;
            color: #999;
            margin-top: 20px;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div>
                <div style="display: flex; justify-content: center; align-items: center;">
                    <div class="pole"></div>
                    <span>BARBERÍA</span>
                </div>
            </div>
            <h1>Panel Administrativo</h1>
            <p>Acceso restringido</p>
        </div>

        <div id="alertContainer"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input
                    type="text"
                    id="usuario"
                    placeholder="Ingresa tu usuario"
                    required
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <input
                    type="password"
                    id="contrasena"
                    placeholder="Ingresa tu contraseña"
                    required
                >
            </div>

            <div class="form-group">
                <label for="tipoUsuario">Tipo de Usuario</label>
                <select id="tipoUsuario" required>
                    <option value="">— Selecciona un tipo —</option>
                    <option value="administrador">Administrador</option>
                </select>
            </div>

            <button type="submit" class="login-button" id="btnLogin">
                Ingresar
            </button>
        </form>

        <div class="info-text">
            Este es un panel restringido solo para administradores de la barbería.
            Si no tienes credenciales, contacta al dueño.
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="../conexion_db.js"></script>
    <script src="VistaLogin.js"></script>
</body>
</html>
