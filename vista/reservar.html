<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservar hora · Barbería</title>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../estilos.css">
<style>
  @font-face {
    font-family: 'The Foregen';
    src: url('../assets/fonts/The_Foregen_Regular.otf') format('opentype');
    font-weight: normal;
    font-style: normal;
  }

  /* Header del sitio (igual que index.html/servicios.html) reemplaza el header sticky del panel */
  header{
    position: relative; z-index: 100;
    background: rgba(0, 0, 0, 0.95);
    padding: 20px 40px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(255, 215, 0, 0.2);
  }
  .logo{
    font-size: 24px; font-weight: normal; color: #FFD700;
    font-family: 'The Foregen', sans-serif; letter-spacing: 2px;
  }
  nav{ display: flex; gap: 40px; align-items: center; }
  nav a{
    color: #fff; text-decoration: none; font-size: 14px; font-weight: 500;
    transition: color 0.3s ease; text-transform: uppercase; letter-spacing: 1px;
    font-family: 'The Foregen', sans-serif;
  }
  nav a:hover, nav a.active{ color: #D4AF77; }

  body.pagina-registro{ display: block; padding: 0; }
  .contenido-reserva{
    display: flex; align-items: center; justify-content: center;
    padding: 24px; min-height: calc(100vh - 73px);
  }

  @media (max-width: 768px) {
    header{ padding: 15px 20px; flex-direction: column; gap: 15px; }
    nav{ gap: 20px; }
    nav a{ font-size: 12px; }
  }
</style>
</head>
<body class="pagina-registro">
<header>
  <div class="logo">⚜ BARBERÍA</div>
  <nav>
    <a href="../index.html">Inicio</a>
    <a href="../servicios.html">Servicios</a>
    <a href="../index.html#nosotros">Nosotros</a>
    <a href="../index.html#contacto">Contacto</a>
    <a href="reservar.html" class="active">Reservar</a>
  </nav>
</header>

<div class="contenido-reserva">
<div class="wrap-registro">
  <div class="pole-centrado"></div>
  <h1>Reserva tu hora 💈</h1>
  <p class="sub">Ingresa tu WhatsApp para buscar tu registro</p>

  <form id="form-buscar">
    <label>Tu WhatsApp</label>
    <input type="tel" id="telefono-buscar" required placeholder="+56 9 1234 5678" />
    <button type="submit" id="btn-buscar">Buscar</button>
  </form>

  <div class="msg error" id="msg-no-encontrado">
    No encontramos ese número. <a href="registro.html" style="color:var(--gold-bright);">Regístrate primero</a>.
  </div>

  <div id="paso-reserva" style="display:none;">
    <p class="sub" id="saludo-cliente" style="margin-bottom:20px;"></p>

    <label>Barbero</label>
    <select id="select-barbero"></select>

    <label>Fecha</label>
    <input type="date" id="input-fecha" />

    <label>Horas disponibles</label>
    <div id="grid-horas" class="grid-horas">
      <div class="empty">Elige barbero y fecha</div>
    </div>

    <div class="msg error" id="msg-error-reserva"></div>
  </div>

  <div class="msg" id="msg-ok">✅ ¡Listo! Tu hora quedó reservada.</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../conexion_db.js"></script>
<script src="VistaReserva.js"></script>
<script>
  const conexionDB = ConexionDB.obtenerInstancia();
  const vistaReserva = new VistaReserva(conexionDB);
  vistaReserva.inicializar();
</script>
</body>
</html>
